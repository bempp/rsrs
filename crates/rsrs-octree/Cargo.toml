[package]
name = "rsrs-octree"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"

[dependencies]
bempp-octree = { git = "https://github.com/bempp/octree.git" }
mpi = "0.8"
rsrs-core = { path = "../rsrs-core" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
approx = "0.5"
rand = "0.8"
rand_chacha = "0.3"
rand_distr = "0.4"
rlst.workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
blas-src = { version = "0.14", features = ["accelerate"] }
lapack-src = { version = "0.13", features = ["accelerate"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
blas-src = { version = "0.14", features = ["openblas"] }
lapack-src = { version = "0.13", features = ["openblas"] }
openblas-src = { version = "0.10", features = ["system"] }
