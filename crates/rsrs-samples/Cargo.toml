[package]
name = "rsrs-samples"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"

[features]
default = []
hdf5-store = ["dep:hdf5", "dep:ndarray", "dep:serde_json"]

[dependencies]
num-complex = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
hdf5 = { git = "https://github.com/aldanor/hdf5-rust.git", branch = "master", optional = true }
ndarray = { version = "0.15", optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
serde_json = "1"
