name: 🧪

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  merge_group:

jobs:
  run-tests-rust:
    name: Modular workspace tests
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: 1
    steps:
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Set up MPI
        uses: mpi4py/setup-mpi@v1
        with:
          mpi: openmpi
      - uses: actions/checkout@v4
      - name: Install system libraries
        run:
          sudo apt-get install -y libopenblas-dev liblapack-dev libhdf5-dev pkg-config

      - name: Run unit tests
        run: cargo test --workspace --exclude bempp-rsrs-python
      - name: Run HDF5-enabled tests
        run: cargo test --workspace --exclude bempp-rsrs-python --all-features
      - name: Run unit tests in release mode
        run: cargo test --workspace --exclude bempp-rsrs-python --release
      - name: Check Python extension crate
        run: cargo check -p bempp-rsrs-python --all-features

  perturbed-biegrid-regressions:
    name: Four-structure BIEGrid regression
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Set up MPI
        uses: mpi4py/setup-mpi@v1
        with:
          mpi: openmpi
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            gfortran \
            openmpi-bin \
            libopenmpi-dev \
            libhdf5-dev \
            libopenblas-dev \
            liblapack-dev
      - name: Run perturbed BIEGrid regression suite
        run: cargo test --release -p rsrs-core --test biegrid_dense -- --nocapture

  check-dependencies:
    name: Check dependencies
    if: false
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        rust-version: ["stable"]
    env:
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: git
    steps:
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ matrix.rust-version }}
      - name: Install cargo-upgrades
        run: cargo install cargo-upgrades --version 2.1.2
      - uses: actions/checkout@v4
      - name: Check that dependencies are up to date
        run:
          cargo upgrades
