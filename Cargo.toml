[workspace]
members = [
    "crates/rsrs",
    "crates/rsrs-core",
    "crates/rsrs-octree",
    "crates/rsrs-samples",
    "bindings/python",
]
default-members = [
    "crates/rsrs",
    "crates/rsrs-core",
    "crates/rsrs-octree",
    "crates/rsrs-samples",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
authors = [
    "Ignacia Fierro-Piccardo <ignaciapiccardo@gmail.com>",
    "Timo Betcke <timo.betcke@gmail.com>",
]
homepage = "https://github.com/bempp/rsrs"
repository = "https://github.com/bempp/rsrs"

[workspace.dependencies]
rlst = { git = "https://github.com/ignacia-fp/rlst.git", rev = "c379800dc2db222f0282c25b71d3e88f50926246" }

[profile.release]
debug = 1
